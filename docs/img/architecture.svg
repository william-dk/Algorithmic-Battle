<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" role="img" aria-label="总体架构：空间拓扑、规则集、算法三个可替换插件输入确定性引擎内核，内核输出回放日志，回放日志被 2D 视图、3D 视图和批量统计消费">
<style>
.t{font-size:14px;font-weight:600}.s{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t{fill:#3C3489}.p .s{fill:#534AB7}
.e rect{fill:#E1F5EE;stroke:#0F6E56}.e .t{fill:#085041}.e .s{fill:#0F6E56}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t{fill:#2C2C2A}.n .s{fill:#5F5E5A}
.a{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.l{font-size:12px;fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="500" fill="#FFFFFF"/>
<g class="p"><rect x="40" y="40" width="180" height="56" rx="8"/><text class="t" x="130" y="58" text-anchor="middle" dominant-baseline="central">空间拓扑</text><text class="s" x="130" y="76" text-anchor="middle" dominant-baseline="central">2D / 3D / 环面</text></g>
<g class="p"><rect x="250" y="40" width="180" height="56" rx="8"/><text class="t" x="340" y="58" text-anchor="middle" dominant-baseline="central">规则集</text><text class="s" x="340" y="76" text-anchor="middle" dominant-baseline="central">第一级 / 第二级</text></g>
<g class="p"><rect x="460" y="40" width="180" height="56" rx="8"/><text class="t" x="550" y="58" text-anchor="middle" dominant-baseline="central">算法</text><text class="s" x="550" y="76" text-anchor="middle" dominant-baseline="central">BFS、Voronoi、用户 AI…</text></g>
<line class="a" x1="130" y1="96" x2="130" y2="146" marker-end="url(#arrow)"/>
<line class="a" x1="340" y1="96" x2="340" y2="146" marker-end="url(#arrow)"/>
<line class="a" x1="550" y1="96" x2="550" y2="146" marker-end="url(#arrow)"/>
<g class="e"><rect x="40" y="156" width="600" height="56" rx="8"/><text class="t" x="340" y="174" text-anchor="middle" dominant-baseline="central">确定性引擎内核</text><text class="s" x="340" y="192" text-anchor="middle" dominant-baseline="central">观察 → 决策 → 校验 → 结算 → 判胜</text></g>
<line class="a" x1="340" y1="212" x2="340" y2="262" marker-end="url(#arrow)"/>
<g class="e"><rect x="220" y="272" width="240" height="56" rx="8"/><text class="t" x="340" y="290" text-anchor="middle" dominant-baseline="central">回放日志</text><text class="s" x="340" y="308" text-anchor="middle" dominant-baseline="central">快照 + 每 tick 的格子变化</text></g>
<line class="a" x1="340" y1="328" x2="340" y2="378" marker-end="url(#arrow)"/>
<path class="a" d="M340 348 L130 348 L130 378" marker-end="url(#arrow)"/>
<path class="a" d="M340 348 L550 348 L550 378" marker-end="url(#arrow)"/>
<g class="n"><rect x="40" y="388" width="180" height="56" rx="8"/><text class="t" x="130" y="406" text-anchor="middle" dominant-baseline="central">2D 视图</text><text class="s" x="130" y="424" text-anchor="middle" dominant-baseline="central">Canvas</text></g>
<g class="n"><rect x="250" y="388" width="180" height="56" rx="8"/><text class="t" x="340" y="406" text-anchor="middle" dominant-baseline="central">3D 视图</text><text class="s" x="340" y="424" text-anchor="middle" dominant-baseline="central">Three.js 体素，可旋转</text></g>
<g class="n"><rect x="460" y="388" width="180" height="56" rx="8"/><text class="t" x="550" y="406" text-anchor="middle" dominant-baseline="central">批量统计</text><text class="s" x="550" y="424" text-anchor="middle" dominant-baseline="central">胜率矩阵 / Elo</text></g>
<g class="p"><rect x="40" y="464" width="12" height="12" rx="2"/></g><text class="l" x="60" y="470" dominant-baseline="central">可替换的插件</text>
<g class="e"><rect x="180" y="464" width="12" height="12" rx="2"/></g><text class="l" x="200" y="470" dominant-baseline="central">确定性内核</text>
<g class="n"><rect x="310" y="464" width="12" height="12" rx="2"/></g><text class="l" x="330" y="470" dominant-baseline="central">只读回放的消费方</text>
</svg>
