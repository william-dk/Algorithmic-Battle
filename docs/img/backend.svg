<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 606" width="680" height="606" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" role="img" aria-label="后端架构：前端只调用 Arena API。接口后面有两种实现：浏览器内实现包含对局运行器、AI 隔离舱和本地存储；服务器实现包含对局工人池、AI 沙箱、数据库与回放库。两种实现都运行同一份引擎内核、SDK 和算法库">
<style>
.t{font-size:14px;font-weight:600}.s{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t{fill:#3C3489}.p .s{fill:#534AB7}
.e rect{fill:#E1F5EE;stroke:#0F6E56}.e .t{fill:#085041}.e .s{fill:#0F6E56}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t{fill:#2C2C2A}.n .s{fill:#5F5E5A}
.a{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c{fill:none;stroke:#888780;stroke-width:1;stroke-dasharray:4 4}
.l{font-size:12px;fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="606" fill="#FFFFFF"/>
<g class="n"><rect x="220" y="30" width="240" height="44" rx="8"/><text class="t" x="340" y="52" text-anchor="middle" dominant-baseline="central">前端的六个界面</text></g>
<line class="a" x1="340" y1="74" x2="340" y2="104" marker-end="url(#arrow)"/>
<g class="p"><rect x="140" y="114" width="400" height="56" rx="8"/><text class="t" x="340" y="132" text-anchor="middle" dominant-baseline="central">Arena API</text><text class="s" x="340" y="150" text-anchor="middle" dominant-baseline="central">前端只认这一个接口</text></g>
<line class="a" x1="185" y1="170" x2="185" y2="222" marker-end="url(#arrow)"/>
<line class="a" x1="495" y1="170" x2="495" y2="222" marker-end="url(#arrow)"/>
<rect class="c" x="40" y="232" width="290" height="224" rx="8"/>
<text class="l" x="56" y="251" dominant-baseline="central">浏览器内实现 · 第一阶段起</text>
<g class="e"><rect x="56" y="268" width="258" height="52" rx="8"/><text class="t" x="185" y="285" text-anchor="middle" dominant-baseline="central">对局运行器</text><text class="s" x="185" y="303" text-anchor="middle" dominant-baseline="central">在 Web Worker 里跑引擎</text></g>
<g class="e"><rect x="56" y="330" width="258" height="52" rx="8"/><text class="t" x="185" y="347" text-anchor="middle" dominant-baseline="central">AI 隔离舱</text><text class="s" x="185" y="365" text-anchor="middle" dominant-baseline="central">每个 AI 一个 Worker</text></g>
<g class="e"><rect x="56" y="392" width="258" height="52" rx="8"/><text class="t" x="185" y="409" text-anchor="middle" dominant-baseline="central">本地存储</text><text class="s" x="185" y="427" text-anchor="middle" dominant-baseline="central">回放、战绩、我的 AI</text></g>
<rect class="c" x="350" y="232" width="290" height="224" rx="8"/>
<text class="l" x="366" y="251" dominant-baseline="central">服务器实现 · 开放给别人时才需要</text>
<g class="e"><rect x="366" y="268" width="258" height="52" rx="8"/><text class="t" x="495" y="285" text-anchor="middle" dominant-baseline="central">对局工人池</text><text class="s" x="495" y="303" text-anchor="middle" dominant-baseline="central">任务队列加多个进程</text></g>
<g class="e"><rect x="366" y="330" width="258" height="52" rx="8"/><text class="t" x="495" y="347" text-anchor="middle" dominant-baseline="central">AI 沙箱</text><text class="s" x="495" y="365" text-anchor="middle" dominant-baseline="central">限时、限内存、断网</text></g>
<g class="e"><rect x="366" y="392" width="258" height="52" rx="8"/><text class="t" x="495" y="409" text-anchor="middle" dominant-baseline="central">数据库与回放库</text><text class="s" x="495" y="427" text-anchor="middle" dominant-baseline="central">账号、AI 版本、天梯</text></g>
<line class="a" x1="185" y1="456" x2="185" y2="486" marker-end="url(#arrow)"/>
<line class="a" x1="495" y1="456" x2="495" y2="486" marker-end="url(#arrow)"/>
<g class="p"><rect x="40" y="496" width="600" height="56" rx="8"/><text class="t" x="340" y="514" text-anchor="middle" dominant-baseline="central">引擎内核 + SDK + 算法库</text><text class="s" x="340" y="532" text-anchor="middle" dominant-baseline="central">同一份代码，两边都跑</text></g>
<g class="p"><rect x="40" y="572" width="12" height="12" rx="2"/></g><text class="l" x="60" y="578" dominant-baseline="central">两种部署共用的代码</text>
<g class="e"><rect x="240" y="572" width="12" height="12" rx="2"/></g><text class="l" x="260" y="578" dominant-baseline="central">随部署方式替换的部分</text>
</svg>
